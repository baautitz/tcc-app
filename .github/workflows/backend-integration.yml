name: Backend - integração com Postgres

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tcc-backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tcc_test
          POSTGRES_PASSWORD: tcc_test
          POSTGRES_DB: tcc_integration_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U tcc_test -d tcc_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://tcc_test:tcc_test@127.0.0.1:5432/tcc_integration_test
      CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      TCC_POSTGRES_INTEGRATION: "1"
      TCC_SMOKE_EXTERNAL_PORT: "5433"
    steps:
      - uses: actions/checkout@v4
      # Segunda porta loopback (TCC_SMOKE_EXTERNAL_PORT) via proxy TCP, em vez de
      # depender de mapeamento duplicado no service container (não verificado).
      - name: Publicar segunda porta do Postgres
        working-directory: .
        run: |
          docker run -d --name pg-proxy --network host alpine/socat \
            TCP-LISTEN:5433,bind=127.0.0.1,fork,reuseaddr TCP:127.0.0.1:5432
          for i in $(seq 1 20); do
            (echo > /dev/tcp/127.0.0.1/5433) 2>/dev/null && exit 0
            sleep 1
          done
          echo "Porta 5433 não ficou disponível" >&2
          docker logs pg-proxy >&2
          exit 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tcc-backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test
