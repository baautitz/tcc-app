name: olist

services:
  postgres:
    image: postgres:18-alpine
    shm_size: 512mb
    container_name: olist-postgres
    environment:
      POSTGRES_DB: olist
      POSTGRES_USER: olist_owner
      POSTGRES_PASSWORD: ${OLIST_POSTGRES_PASSWORD:-olist_owner_local_password}
      OLIST_READER_PASSWORD: ${OLIST_READER_PASSWORD:-olist_readonly_password}
    ports:
      - "${OLIST_POSTGRES_PORT:-5433}:5432"
    volumes:
      - olist_postgres_data:/var/lib/postgresql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./data:/docker-entrypoint-initdb.d/data:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -tAc \"SELECT to_regclass('olist.orders') IS NOT NULL\" | grep -qx t"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  olist_postgres_data:
